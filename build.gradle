plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id 'com.hypherionmc.modutils.modpublisher' version "2.+" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        maven { url = 'https://maven.minecraftforge.net/' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
	
	tasks.withType(ProcessResources).configureEach {
        var replaceProperties = [
                minecraft_version   : minecraft_version,
                neo_version         : neoforge_version,
                cristellib_version : cristellib_version,

                version: mod_version,



                neo_loader_version_range: neo_loader_version_range,
                neo_version_range: neo_version_range,

                fabric_loader_min_version: fabric_loader_min_version,

                mod_id              : archives_name, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version, mod_description: mod_description, homepage : homepage
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml']) {
            expand replaceProperties + [project: project]
        }
        filesMatching(['fabric.mod.json']) {
            expand replaceProperties + [project: project]
        }
    }
	

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    def changelogSource = rootProject.file("CHANGELOG.md")
    def changelogOutput = layout.buildDirectory.file("changelog.md")

    tasks.register("generateChangelog") {
        inputs.file(changelogSource)
        inputs.property('version', project.version)
        outputs.file(changelogOutput)
        doLast {
            if (!changelogSource.exists()) {
                throw new GradleException("Missing CHANGELOG.md at ${changelogSource}")
            }

            def lines = changelogSource.readLines("UTF-8")
            def versionHeader = "## [${project.version}]"
            def versionHeaderAlt = "## ${project.version}"
            int start = -1
            for (int i = 0; i < lines.size(); i++) {
                if (lines[i].startsWith(versionHeader) || lines[i].startsWith(versionHeaderAlt)) {
                    start = i
                    break
                }
            }
            if (start == -1) {
                def outFile = changelogOutput.get().asFile
                outFile.parentFile.mkdirs()
                outFile.text = ""
                return
            }

            int end = lines.size()
            for (int i = start + 1; i < lines.size(); i++) {
                if (lines[i].startsWith("## ")) {
                    end = i
                    break
                }
            }

            def section = lines.subList(start + 1, end).join(System.lineSeparator()).trim()
            def outFile = changelogOutput.get().getAsFile()
            outFile.parentFile.mkdirs()
            outFile.text = section + System.lineSeparator()
        }
    }

    tasks.matching { it.name in ["publishMod", "publishModrinth", "publishCurseforge", "publishGitHub"] }.configureEach {
        dependsOn("generateChangelog")
    }

    plugins.withId("com.hypherionmc.modutils.modpublisher") {
        publisher {
            setChangelog(changelogOutput.get().getAsFile())
        }
    }
}
